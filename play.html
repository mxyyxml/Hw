<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1d2433">
  <title>Lunch Break Skate</title>
  <style>
/* =============================================================================
   Lunch Break Skate — HUD & menus
   ============================================================================= */
:root {
  --ink: #1d2433;
  --paper: #fffaf0;
  --accent: #f4743b;
  --accent2: #2a9d8f;
  --gold: #f2c14e;
  --bad: #e63946;
  --glass: rgba(20, 26, 38, 0.62);
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3f0; color: #fff; user-select: none; }
#game { display: block; width: 100vw; height: 100vh; }
.hidden { display: none !important; }
kbd {
  display: inline-block; min-width: 1.6em; padding: 1px 6px; border-radius: 5px; text-align: center;
  background: #fff; color: var(--ink); border-bottom: 3px solid #b9b3a5; font: bold 0.85em/1.4 monospace;
}
.muted { opacity: 0.75; font-size: 0.9em; }

/* ---------------------------------------------------------------- HUD */
#hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 2px 3px rgba(0,0,0,0.35); }
.panel-sm { position: absolute; background: var(--glass); border-radius: 12px; padding: 10px 14px; }
.hud-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.85; }
.hud-sub { font-size: 12px; opacity: 0.8; }
#hud-challenges { top: 14px; left: 14px; max-width: 290px; }
#hud-challenges ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
#hud-challenges li { margin: 2px 0; }
#hud-score { top: 14px; right: 14px; text-align: right; min-width: 150px; }
#score { font-size: 30px; font-weight: bold; color: var(--gold); }
#lunch-timer { font-size: 28px; font-weight: bold; margin-bottom: 4px; }
#lunch-timer.low { color: var(--bad); animation: pulse 0.6s infinite alternate; }
#hud-speed { bottom: 14px; left: 14px; width: 220px; }
#speed-bar { height: 10px; margin-top: 6px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; }
#speed-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent2), var(--gold), var(--accent)); }
#hud-hint { position: absolute; bottom: 14px; right: 16px; font-size: 12px; opacity: 0.8; }

#combo { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); text-align: center; max-width: 80vw; }
#combo-chain { font-size: 18px; font-weight: bold; }
#combo-points { font-size: 30px; font-weight: bold; color: var(--gold); }
#combo-points .x { color: #fff; font-size: 24px; }
#combo-timer { height: 4px; width: 160px; margin: 4px auto 0; background: rgba(255,255,255,0.25); border-radius: 2px; overflow: hidden; }
#combo-timer-fill { height: 100%; background: #fff; width: 100%; }
#combo.banked #combo-points { color: #7ae582; }
#combo.dropped #combo-points { color: var(--bad); text-decoration: line-through; }

#popups { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; }
.popup {
  font-size: 34px; font-weight: 900; color: #fff; letter-spacing: 1px; white-space: nowrap;
  -webkit-text-stroke: 1px rgba(0,0,0,0.35); animation: pop 1.1s ease-out forwards;
}
.popup.bail { color: var(--bad); font-size: 40px; }
.popup.good { color: #7ae582; }
.popup.small { font-size: 22px; }
@keyframes pop {
  0% { transform: scale(0.4); opacity: 0; }
  15% { transform: scale(1.15); opacity: 1; }
  30% { transform: scale(1); }
  80% { opacity: 1; transform: translateY(-10px); }
  100% { opacity: 0; transform: translateY(-30px); }
}
@keyframes pulse { from { opacity: 1; } to { opacity: 0.45; } }

#toast { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: var(--glass); padding: 8px 18px; border-radius: 20px; font-size: 15px; }
#toast.challenge { background: rgba(42, 157, 143, 0.92); font-size: 18px; font-weight: bold; }

#balance { position: absolute; left: 50%; top: 62%; width: 260px; height: 16px; transform: translateX(-50%);
  border-radius: 8px; background: linear-gradient(90deg, var(--bad), var(--gold) 30%, #7ae582 50%, var(--gold) 70%, var(--bad)); border: 2px solid #fff; }
#balance-mark { position: absolute; top: -6px; left: 50%; width: 6px; height: 24px; margin-left: -3px; background: #fff; border-radius: 3px; box-shadow: 0 0 4px #000; }

/* ---------------------------------------------------------------- screens */
.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#title { background: linear-gradient(180deg, rgba(20,26,38,0.15), rgba(20,26,38,0.55)); }
.title-card { text-align: center; padding: 24px; }
.logo { display: flex; flex-direction: column; line-height: 0.9; transform: rotate(-4deg); margin-bottom: 14px; }
.logo .l1 { font-size: 34px; font-weight: bold; color: var(--paper); letter-spacing: 3px; text-shadow: 3px 3px 0 var(--ink); }
.logo .l2 { font-size: 88px; font-weight: 900; color: var(--accent); letter-spacing: 6px;
  text-shadow: 4px 4px 0 var(--ink), 8px 8px 0 rgba(0,0,0,0.25); }
.tagline { font-size: 17px; text-shadow: 0 2px 3px rgba(0,0,0,0.5); }
.menu-buttons { display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 18px 0; }
button {
  font: bold 17px "Trebuchet MS", system-ui, sans-serif; color: var(--ink); background: var(--paper);
  border: none; border-radius: 12px; padding: 11px 22px; min-width: 230px; cursor: pointer;
  box-shadow: 0 4px 0 #b9b3a5; transition: transform 0.08s;
}
button:hover, button:focus-visible { transform: translateY(-2px); background: #fff; outline: 3px solid var(--gold); }
button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b9b3a5; }
button.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 0 #b4501f; }
button small { font-weight: normal; opacity: 0.7; }
button.sel { background: var(--accent2); color: #fff; box-shadow: 0 4px 0 #1b6d63; }
.row-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.row-buttons button { min-width: 0; }

#menu { background: rgba(10, 14, 22, 0.55); }
.card {
  background: rgba(24, 30, 44, 0.94); border-radius: 18px; padding: 22px 28px; max-width: 640px; width: calc(100vw - 32px);
  max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}
.card h2 { margin: 0 0 12px; color: var(--gold); text-align: center; }
.card .menu-buttons button { min-width: 260px; }
#help { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,14,22,0.45); pointer-events: none; }
.controls { font-size: 14px; }
.ctl-row { display: grid; grid-template-columns: 44% 1fr; gap: 8px; padding: 4px 2px; border-bottom: 1px solid rgba(255,255,255,0.08); break-inside: avoid; }
.ctl-section { color: var(--gold); font-weight: bold; padding: 10px 0 2px; break-after: avoid; }
/* the H overlay is wider and split into two columns so it fits without scrolling */
#help .card { max-width: 1000px; padding: 16px 22px; }
#help .controls { column-count: 2; column-gap: 28px; font-size: 12.5px; }
#help .ctl-row { padding: 2px; }
#help kbd { font-size: 0.8em; }
@media (max-width: 760px) { #help .controls { column-count: 1; } }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0; }
.setting input[type=range] { width: 55%; accent-color: var(--accent); }
ul.challenge-list { list-style: none; padding: 0; margin: 0; }
ul.challenge-list li { padding: 8px 10px; margin: 6px 0; border-radius: 8px; background: rgba(255,255,255,0.06); }
ul.challenge-list li.done { background: rgba(42,157,143,0.35); }
ul.challenge-list li .tick { display: inline-block; width: 22px; }
.big-score { font-size: 54px; font-weight: 900; color: var(--gold); text-align: center; margin: 6px 0; }
.center { text-align: center; }

/* ---------------------------------------------------------------- Closet */
#menu:has(.closet) { background: rgba(10, 14, 22, 0.15); justify-content: flex-end; }
#menu:has(.closet) .card { margin-right: 16px; max-width: 460px; }
.closet-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
.closet-label { width: 96px; flex: none; font-size: 13px; opacity: 0.85; }
.closet .row-buttons { justify-content: flex-start; }
button.chip { min-width: 0; padding: 6px 10px; font-size: 13px; box-shadow: 0 2px 0 #b9b3a5; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
button.swatch { min-width: 0; width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); box-shadow: none; }
button.swatch.sel { outline: 3px solid var(--gold); border-color: #fff; }

/* ---------------------------------------------------------------- touch controls */
body.touch, body.touch * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.touch #game { touch-action: none; }
#touch { position: fixed; inset: 0; pointer-events: none; z-index: 5; touch-action: none; }
#touch > * { pointer-events: auto; }
#t-stick-zone { position: absolute; left: 0; bottom: 0; width: 45vw; height: 62vh; }
#t-stick-base { position: absolute; left: 22%; top: 62%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35); }
#t-stick-base.active { background: rgba(255,255,255,0.2); }
#t-stick-knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; transform: translate(-50%, -50%); border-radius: 50%;
  background: rgba(255,255,255,0.75); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.t-hint { position: absolute; left: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font-size: 11px; opacity: 0.6; }
#t-pad { position: absolute; right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  width: 136px; height: 136px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(244, 116, 59, 0.55); border: 3px solid rgba(255,255,255,0.6); font-weight: 900; font-size: 22px; color: #fff; }
#t-pad small { font-size: 9px; font-weight: normal; opacity: 0.85; }
#t-pad.active { background: rgba(244, 116, 59, 0.85); transform: scale(0.96); }
#t-buttons { position: absolute; right: calc(176px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: repeat(2, 72px); gap: 10px; }
.t-btn, .t-sm { min-width: 0; padding: 0; color: #fff; background: rgba(20, 26, 38, 0.55); border: 2px solid rgba(255,255,255,0.45);
  box-shadow: none; font: bold 12px system-ui, sans-serif; border-radius: 14px; }
.t-btn { height: 52px; }
.t-btn.active, .t-sm.active { background: rgba(42, 157, 143, 0.85); transform: none; }
#t-top { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.t-sm { width: 46px; height: 36px; border-radius: 10px; }
#t-rotate { display: none; position: absolute; top: 50px; left: 50%; transform: translateX(-50%); background: rgba(20,26,38,0.8);
  padding: 8px 14px; border-radius: 16px; font-size: 13px; white-space: nowrap; pointer-events: none; }
@media (orientation: portrait) { #t-rotate { display: block; } }

/* smaller HUD on touch screens so the thumbs have room */
body.touch #hud-hint { display: none; }
body.touch #hud-speed { bottom: auto; top: 14px; left: 50%; transform: translateX(-50%); width: 150px; padding: 6px 10px; display: none; }
body.touch #hud-challenges { transform: scale(0.82); transform-origin: top left; }
body.touch #hud-score { transform: scale(0.82); transform-origin: top right; }
body.touch #combo { bottom: 170px; }
body.touch #balance { top: 40%; }
body.touch .popup { font-size: 26px; }
@media (max-height: 460px) {
  .logo .l2 { font-size: 56px; } .logo .l1 { font-size: 24px; }
  .menu-buttons { gap: 6px; margin: 10px 0; } button { padding: 8px 18px; font-size: 15px; }
  .tagline { display: none; }
}

</style>
  
</head>
<body>
  <canvas id="game"></canvas>

  <!-- ============================== HUD ============================== -->
  <div id="hud" class="hidden">
    <div id="hud-challenges" class="panel-sm">
      <div class="hud-label">Challenges <span id="ch-count">0/10</span></div>
      <ul id="ch-next"></ul>
    </div>
    <div id="hud-score" class="panel-sm">
      <div id="lunch-timer" class="hidden">2:00</div>
      <div class="hud-label">Score</div>
      <div id="score">0</div>
      <div class="hud-sub">Best combo <span id="best-combo">0</span></div>
    </div>
    <div id="popups"></div>
    <div id="toast" class="hidden"></div>
    <div id="balance" class="hidden"><div id="balance-mark"></div></div>
    <div id="combo" class="hidden">
      <div id="combo-chain"></div>
      <div id="combo-points"><span id="combo-sum">0</span> <span class="x">x<span id="combo-mult">1</span></span></div>
      <div id="combo-timer"><div id="combo-timer-fill"></div></div>
    </div>
    <div id="hud-speed" class="panel-sm">
      <div class="hud-label">Speed <span id="speed-num">0</span> km/h</div>
      <div id="speed-bar"><div id="speed-fill"></div></div>
    </div>
    <div id="hud-hint">H help · P pause · C camera · Closet in the pause menu</div>
  </div>

  <!-- ============================== HELP OVERLAY (H) ============================== -->
  <div id="help" class="hidden">
    <div class="card">
      <h2>Controls</h2>
      <div id="help-body"></div>
      <p class="muted">Press <kbd>H</kbd> to close</p>
    </div>
  </div>

  <!-- ============================== TITLE SCREEN ============================== -->
  <div id="title" class="screen">
    <div class="title-card">
      <div class="logo"><span class="l1">Lunch Break</span><span class="l2">SKATE</span></div>
      <p class="tagline">Free-roam the plaza. Flick tricks. Be back before the bell.</p>
      <div class="menu-buttons">
        <button data-act="play" class="primary">Play</button>
        <button data-act="lunch">Lunch Session <small>2 min</small></button>
        <button data-act="challenges">Challenges</button>
        <button data-act="closet">Closet</button>
        <button data-act="controls">Controls</button>
        <button data-act="settings">Settings</button>
      </div>
      <p class="muted" id="title-best"></p>
    </div>
  </div>

  <!-- ============================== MENU PANEL (pause, settings, etc.) ============================== -->
  <div id="menu" class="screen hidden">
    <div class="card" id="menu-card"></div>
  </div>

  <noscript>Lunch Break Skate needs JavaScript.</noscript>
